schema_version: 1
experiment: assign_add
task_seed: 42
model_seed: 42
train_seed: 43
eval_seed: 44
data:
  modulus: 59
  n_vars: 12
  seq_len: 16
  train_pair_fraction: 0.7
  # Actual pinned-code restrictions: k,l cannot be LHS; a,b cannot be RHS.
  forbidden_lhs: [10, 11]
  forbidden_rhs: [0, 1]
model:
  n_embd: 128
  n_head: 1
  n_layer: 2
  n_mlp: 512
  init_std: 0.07071067811865475
train:
  steps: 30000
  batch_size: 512
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.02
  betas: [0.9, 0.999]
  scheduler: constant
  warmup_steps: 0
  grad_clip: 0.0
  eval_every: 100
  save_every: 100
  analysis_every: 100
  precision: fp32
  deterministic: true
  threads: 4
eval:
  episodes: 12000
  batch_size: 512
  diagnostic_episodes: 600
analysis:
  enabled: true
  save_activations: false
smoke:
  model:
    n_embd: 32
    n_head: 1
    n_layer: 2
    n_mlp: 64
  train:
    steps: 4
    batch_size: 4
    eval_every: 2
    save_every: 2
    threads: 1
  eval:
    episodes: 18
    batch_size: 6
    diagnostic_episodes: 18
